<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f3c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b8d4;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6" ry="6" fill="url(#bg)" />

  <!-- Left angle bracket < -->
  <polyline
    points="5,10 2,16 5,22"
    fill="none"
    stroke="url(#cyan)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Right angle bracket > -->
  <polyline
    points="27,10 30,16 27,22"
    fill="none"
    stroke="url(#cyan)"
    stroke-width="2.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Letter M - bold, centered -->
  <text
    x="16"
    y="21"
    font-family="'Arial Black', 'Impact', sans-serif"
    font-size="13"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    letter-spacing="-0.5"
  >M</text>

  <!-- Cyan cursor/dot accent below M -->
  <rect x="14.5" y="23.5" width="3" height="2.5" rx="0.5" fill="#00e5ff" opacity="0.9"/>
</svg>
